version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kai_postgres
    environment:
      POSTGRES_DB: kaisyndicate
      POSTGRES_USER: kai_user
      POSTGRES_PASSWORD: kai_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
